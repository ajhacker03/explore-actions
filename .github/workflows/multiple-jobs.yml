name: Multiple Jobs

on: push

jobs:
    build_job:
        runs-on: ubuntu-latest
        steps:
            - name: Install Cowsay
              run: sudo apt-get install cowsay -y

            - name: Execute Cowsay
              run: cowsay -f dragon "Run for cover, I am Dragon" >> dragon.txt

            - name: Upload Dragon.txt File
              uses: actions/upload-artifact@v7
              with:
                  # upload in root directory
                  name: dragon-txt-file
                  path: dragon.txt

    test_job:
        needs: build_job
        runs-on: ubuntu-latest
        steps:
            - name: Download Dragon.txt File
              uses: actions/download-artifact@v8
              with:
                  name: dragon-txt-file

            - name: Test File Exists
              run: grep -i "dragon" dragon.txt

    deploy_job:
        needs: test_job
        runs-on: ubuntu-latest
        steps:
            - name: Download Dragon.txt File
              uses: actions/download-artifact@v8
              with:
                  name: dragon-txt-file

            - name: Read File
              run: cat dragon.txt
