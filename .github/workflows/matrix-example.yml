name: Matrix Example

on:
    push:
    workflow_dispatch:

jobs:
    matrix-job:
        strategy:
            # six different jobs will be created: 3 os, 2 images 3x2 = 6
            # all these 6 jobs will be running in parallel
            matrix:
                # user defined variables below
                os: [ubuntu-latest, ubuntu-20.04, windows-latest]
                images: [hello-world, alpine]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Echo Docker details
              run: docker info

            - name: Run Image on ${{ matrix.os }}
              run: docker run ${{ matrix.images }}
