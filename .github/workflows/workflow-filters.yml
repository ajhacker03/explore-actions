name: Workflow Filters and Activities

on:
    # dont have any activities for push, but we can use filters
    push:
        branches:
            - main
            - "!feature/*" # igonre pushing to any branch name starting with feature using ! operator

        # push will not trigger the workflow for the below branches
        # branches-ignore:
        #     - feature/* # feature/add-music, feature/update-images
        #     - test/** # test/ui/index, test/checkout/payment

    workflow_dispatch:

    pull_request:
        types:
            - opened
            - closed
        paths-ignore: # workflow will only run when the PR that includes changes on any files other than README.md
            - README.md
        branches: # configures the workflow to only run on PR that target specific branches
            - main

    # schedule: - cron "*/59 * * * *" (every 59 mins)

jobs:
    workflow-filters:
        runs-on: ubuntu-latest
        steps:
            - name: Hello on ${{ github.event_name }}
              run: echo This workflow/step/job is executed for the event type - ${{ github.event_name }}
