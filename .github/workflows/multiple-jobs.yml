name: Multiple Jobs

on: push

jobs:
    build_job:
        runs-on: ubuntu-latest
        steps:
            - name: Install Cowsay
              run: sudo apt-get install cowsay -y

            - name: Execute Cowsay
              run: cowsay -f dragon "Run for cover, I am Dragon" >> dragon.txt

    test_job:
        runs-on: ubuntu-latest
        steps:
            - name: Test File Exists
              run: grep -i "dragon" dragon.txt

    deploy_job:
        runs-on: ubuntu-latest
        steps:
            - name: Read File
              run: cat dragon.txt
